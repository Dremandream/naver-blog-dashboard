name: 네이버 블로그 이웃새글 수집

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 오전 8시 KST (UTC 23:00)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # posts.json push 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # [수정 D] Playwright hang 시 과금 방지

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: 이웃새글 수집 및 요약
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        run: node scripts/scrape-naver.js

      - name: posts.json 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/posts.json
          git diff --staged --quiet && echo "변경 없음" || (
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 이웃새글 업데이트"
            git push
          )
