name: 네이버 블로그 이웃새글 수집

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 오전 8시 KST (UTC 23:00)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # posts.json push 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 이웃새글 수집 및 요약 (RSS)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/collect-rss.js

      - name: 데이터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 수집기가 만드는 모든 산출물 스테이징 (누락 시 rebase 실패 방지)
          git add public/data/posts.json config/stock-codes.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 수집 업데이트"
            # 원격 최신 반영 후 push (충돌 시 원격 우선으로 재시도)
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          fi
