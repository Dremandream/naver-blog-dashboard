name: 소스 적중률 주간 가격 갱신

on:
  schedule:
    - cron: '0 18 * * 6' # 일요일 KST 03:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-score-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 공식 의견 가격과 적중률 갱신
        run: node scripts/refresh-source-scores.js
      - run: npm run build
      - name: 데이터 커밋과 push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/history.json public/data/posts.json config/stock-codes.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 소스 적중률 주간 가격 갱신"
            git pull --rebase -X theirs origin main
            git push
          fi
